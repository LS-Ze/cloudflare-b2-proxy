name = "aws-signature-proxy-worker"
main = "index.js"
compatibility_date = "2023-09-21"
compatibility_flags = ["nodejs_compat"]

[vars]
# 七牛云S3配置
AWS_S3_ENDPOINT = "s3.ap-southeast-1.qiniucs.com"  # 七牛云S3服务域名
AWS_S3_BUCKET = "lsdns-oss"                        # 七牛云S3空间名

# Backblaze B2配置（取消注释以使用）
# AWS_S3_ENDPOINT = "s3.us-west-002.backblazeb2.com"  # Backblaze B2端点
# AWS_S3_BUCKET = "your-backblaze-bucket"             # Backblaze存储桶名

# 可选配置
# WEBHOOK_URL = "https://your-webhook-url.com"        # webhook通知URL

[build]
command = "npm install aws4fetch"
